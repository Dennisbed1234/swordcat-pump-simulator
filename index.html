<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Meme Pump Simulator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0f;
      --card: #12121a;
      --card2: #16161f;
      --border: #1e1e2a;
      --green: #00e676;
      --red: #ff5252;
      --muted: #777;
      --text: #e8e8e8;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      min-height: 100vh;
      display: flex;
      overflow-x: hidden;
    }

    .sidebar {
      width: 260px;
      background: #0d0d14;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: transform 0.25s ease;
      z-index: 50;
    }
    .sidebar-header {
      padding: 18px 16px 12px;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.3px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .sidebar-header span { color: var(--green); }
    .coin-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }
    .coin-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      cursor: pointer;
      transition: background 0.15s;
      border-left: 3px solid transparent;
    }
    .coin-item:hover { background: rgba(255,255,255,0.03); }
    .coin-item.active {
      background: rgba(0, 230, 118, 0.08);
      border-left-color: var(--green);
    }
    .coin-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #1a1a24;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
      overflow: hidden;
    }
    .coin-meta { flex: 1; min-width: 0; }
    .coin-name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .coin-sub { font-size: 11px; color: var(--muted); margin-top: 1px; }
    .coin-price-side { text-align: right; font-size: 12px; font-variant-numeric: tabular-nums; }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 12px 12px;
      min-width: 0;
      position: relative;
    }
    .menu-btn {
      display: none;
      position: absolute;
      top: 14px;
      left: 14px;
      background: var(--card);
      border: 1px solid var(--border);
      color: #ccc;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      font-size: 20px;
      cursor: pointer;
      z-index: 40;
      align-items: center;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 0 50px rgba(0, 255, 150, 0.06);
      border: 1px solid var(--border);
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 18px 6px;
    }
    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff6b00, #ffd700);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
      overflow: hidden;
    }
    .token-info { flex: 1; min-width: 0; }
    .token-name {
      font-weight: 700;
      font-size: 17px;
      letter-spacing: 0.2px;
    }
    .token-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 1px;
    }
    .header-icons {
      display: flex;
      gap: 14px;
      color: #555;
      font-size: 17px;
    }

    .price-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 6px 18px 10px;
    }
    .price-block .price {
      font-size: 26px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.5px;
    }
    .price-block .change {
      font-size: 13px;
      margin-top: 2px;
      font-weight: 600;
    }
    .mcap-block { text-align: right; }
    .mcap-block .mcap {
      font-size: 17px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .mcap-block .label {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }
    .green { color: var(--green); }
    .red { color: var(--red); }

    .chart-wrap {
      position: relative;
      height: 260px;
      margin: 0 10px;
      background: linear-gradient(180deg, #0b0b11 0%, #0a0a0e 100%);
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.04);
    }
    canvas { width: 100%; height: 100%; display: block; }
    .live-badge {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(6px);
      color: var(--green);
      font-size: 11px;
      font-weight: 600;
      padding: 3px 12px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
      letter-spacing: 0.3px;
      border: 1px solid rgba(0,230,118,0.15);
    }
    .live-dot {
      width: 6px;
      height: 6px;
      background: var(--green);
      border-radius: 50%;
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }
    .overlay-text {
      position: absolute;
      top: 42%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 2px 14px rgba(0,0,0,0.9);
      opacity: 0;
      transition: opacity 0.35s;
      pointer-events: none;
      text-align: center;
      white-space: nowrap;
      z-index: 5;
    }
    .overlay-text.show { opacity: 1; }

    .controls {
      padding: 14px 16px 6px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .input-row { display: flex; gap: 10px; }
    .input-group {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .input-group label {
      font-size: 11px;
      color: var(--muted);
      padding-left: 2px;
    }
    input[type="number"] {
      width: 100%;
      background: #1a1a24;
      border: 1px solid #2a2a3a;
      border-radius: 12px;
      color: #fff;
      font-size: 15px;
      padding: 11px 12px;
      outline: none;
      font-variant-numeric: tabular-nums;
    }
    input[type="number"]:focus { border-color: var(--green); }
    .btn-row { display: flex; gap: 10px; }
    button {
      flex: 1;
      background: linear-gradient(135deg, #00c853, #00e676);
      color: #000;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 15px;
      padding: 12px 18px;
      cursor: pointer;
      transition: transform 0.12s, opacity 0.15s;
    }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-secondary {
      background: #1a1a24;
      color: #ccc;
      border: 1px solid #2a2a3a;
    }

    .position {
      margin: 10px 14px 16px;
      background: var(--card2);
      border-radius: 14px;
      padding: 14px 16px;
      border: 1px solid #22222e;
    }
    .pos-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .pos-label {
      font-size: 12px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .pos-dot {
      width: 7px;
      height: 7px;
      background: var(--green);
      border-radius: 50%;
    }
    .pos-value {
      font-size: 24px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.5px;
    }
    .pos-stats {
      display: flex;
      justify-content: space-between;
      margin-top: 6px;
      align-items: center;
    }
    .pos-tokens {
      font-size: 12px;
      color: var(--muted);
    }
    .pos-pnl {
      font-size: 14px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .footer {
      text-align: center;
      font-size: 11px;
      color: #444;
      margin-top: 12px;
      max-width: 380px;
      line-height: 1.4;
    }

    .live-tag {
      font-size: 10px;
      background: rgba(0,230,118,0.15);
      color: var(--green);
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 6px;
      font-weight: 600;
    }

    @media (max-width: 720px) {
      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        transform: translateX(-100%);
      }
      .sidebar.open { transform: translateX(0); }
      .menu-btn { display: flex; }
      .main {
        padding-top: 58px;
      }
      .overlay-bg {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.55);
        z-index: 45;
      }
      .overlay-bg.show { display: block; }
    }
  </style>
</head>
<body>
  <div class="overlay-bg" id="overlayBg" onclick="closeSidebar()"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div>Meme Coins <span>●</span></div>
      <button onclick="closeSidebar()" style="background:none;border:none;color:#888;font-size:18px;cursor:pointer;padding:0;width:auto;">✕</button>
    </div>
    <div class="coin-list" id="coinList"></div>
  </aside>

  <div class="main">
    <button class="menu-btn" onclick="openSidebar()">☰</button>

    <div class="app">
      <div class="header">
        <div class="avatar" id="avatar">⚔️</div>
        <div class="token-info">
          <div class="token-name" id="tokenName">SWORDCAT</div>
          <div class="token-sub" id="tokenSub">cat wif sword</div>
        </div>
        <div class="header-icons">⏱ ☆ ↗</div>
      </div>

      <div class="price-row">
        <div class="price-block">
          <div class="price green" id="price">$0.000000</div>
          <div class="change green" id="change">▲ 0.00%</div>
        </div>
        <div class="mcap-block">
          <div class="mcap" id="mcap">$0</div>
          <div class="label">Market cap</div>
        </div>
      </div>

      <div class="chart-wrap">
        <canvas id="chart"></canvas>
        <div class="overlay-text" id="overlay"></div>
        <div class="live-badge"><span class="live-dot"></span> LIVE · 1H</div>
      </div>

      <div class="controls">
        <div class="input-row">
          <div class="input-group">
            <label>Trade amount ($)</label>
            <input type="number" id="amount" placeholder="1000" value="1000" min="1" step="1" />
          </div>
          <div class="input-group">
            <label>Start price ($)</label>
            <input type="number" id="customPrice" placeholder="0.0034" step="any" />
          </div>
        </div>
        <div class="btn-row">
          <button id="startBtn" onclick="startSim()">Start Trade</button>
          <button class="btn-secondary" id="resetBtn" onclick="resetSim()" disabled>Stop</button>
        </div>
      </div>

      <div class="position">
        <div class="pos-header">
          <div class="pos-label"><span class="pos-dot"></span> Your position</div>
        </div>
        <div class="pos-value" id="posValue">$1,000.00</div>
        <div class="pos-stats">
          <div class="pos-tokens" id="posTokens">— tokens</div>
          <div class="pos-pnl green" id="posPnl">+$0.00 · 0.00%</div>
        </div>
      </div>
    </div>

    <div class="footer">
      Set your own start price · Live prices for all coins · Live Trading 
    </div>
  </div>

  <script>
    const COINS = [
      { id: 'swordcat', name: 'SWORDCAT', sub: 'cat wif sword', emoji: '⚔️', ca: '5tCju6YNxHq5zrA6tGndr6F7TK42mpUFmeE31cSFpump', supply: 960_000_000, live: true, startPrice: 0.0034, cgId: null },
      { id: 'bonk', name: 'BONK', sub: 'the first dog coin on Solana', emoji: '🐕', ca: null, supply: 88_000_000_000_000, live: true, startPrice: 0.000022, cgId: 'bonk' },
      { id: 'wif', name: 'WIF', sub: 'dogwifhat', emoji: '🎩', ca: null, supply: 998_000_000, live: true, startPrice: 1.85, cgId: 'dogwifcoin' },
      { id: 'popcat', name: 'POPCAT', sub: 'popcat the cat', emoji: '😺', ca: null, supply: 980_000_000, live: true, startPrice: 0.85, cgId: 'popcat' },
      { id: 'mew', name: 'MEW', sub: 'cat in a dogs world', emoji: '🐱', ca: null, supply: 88_000_000_000, live: true, startPrice: 0.0045, cgId: 'cat-in-a-dogs-world' },
      { id: 'pepe', name: 'PEPE', sub: 'pepe the frog', emoji: '🐸', ca: null, supply: 420_690_000_000_000, live: true, startPrice: 0.0000095, cgId: 'pepe' },
      { id: 'mog', name: 'MOG', sub: 'mog coin', emoji: '🗿', ca: null, supply: 390_000_000_000_000, live: true, startPrice: 0.0000012, cgId: 'mog-coin' },
      { id: 'fartcoin', name: 'FARTCOIN', sub: 'fartcoin', emoji: '💨', ca: null, supply: 1_000_000_000, live: true, startPrice: 0.65, cgId: 'fartcoin' }
    ];

    let currentCoin = COINS[0];
    let livePriceCache = {};

    const canvas = document.getElementById('chart');
    const ctx = canvas.getContext('2d');
    let W, H;

    function resize() {
      const rect = canvas.parentElement.getBoundingClientRect();
      const dpr = devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      canvas.style.width = rect.width + 'px';
      canvas.style.height = rect.height + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      W = rect.width;
      H = rect.height;
    }
    window.addEventListener('resize', () => { resize(); drawChart(); });
    resize();

    let running = false;
    let prices = [];
    let currentPrice = 0.0034;
    let startPrice = 0.0034;
    let tradeAmount = 1000;
    let tokens = 0;
    let phase = 'idle';
    let tick = 0;
    let boomTarget = 0;
    let animId = null;
    let simStartTime = 0;
    const TOTAL_MS = 20000;
    const PHASE_MS = 5000;
    const TICK_MS = 40;

    function formatPrice(p) {
      if (p >= 1000) return '$' + p.toLocaleString('en-US', { maximumFractionDigits: 2 });
      if (p >= 1) return '$' + p.toFixed(4);
      if (p >= 0.01) return '$' + p.toFixed(5);
      if (p >= 0.0001) return '$' + p.toFixed(6);
      if (p >= 0.000001) return '$' + p.toFixed(8);
      return '$' + p.toExponential(3);
    }
    function formatMcap(m) {
      if (m >= 1e12) return '$' + (m / 1e12).toFixed(2) + 'T';
      if (m >= 1e9) return '$' + (m / 1e9).toFixed(2) + 'B';
      if (m >= 1e6) return '$' + (m / 1e6).toFixed(2) + 'M';
      if (m >= 1e3) return '$' + (m / 1e3).toFixed(1) + 'K';
      return '$' + m.toFixed(0);
    }
    function formatMoney(v) {
      return '$' + v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
    function formatPct(p) {
      return (p >= 0 ? '▲ ' : '▼ ') + Math.abs(p).toFixed(2) + '%';
    }

    function getBasePrice() {
      const custom = parseFloat(document.getElementById('customPrice').value);
      if (custom > 0) return custom;
      return livePriceCache[currentCoin.id] || currentCoin.startPrice;
    }

    function updateUI() {
      const mcap = currentPrice * currentCoin.supply;
      const pct = startPrice > 0 ? ((currentPrice - startPrice) / startPrice) * 100 : 0;
      const posVal = tokens * currentPrice;
      const pnl = posVal - tradeAmount;
      const pnlPct = tradeAmount > 0 ? (pnl / tradeAmount) * 100 : 0;

      const priceEl = document.getElementById('price');
      const changeEl = document.getElementById('change');
      priceEl.textContent = formatPrice(currentPrice);
      changeEl.textContent = formatPct(pct);
      priceEl.className = 'price ' + (pct >= 0 ? 'green' : 'red');
      changeEl.className = 'change ' + (pct >= 0 ? 'green' : 'red');

      document.getElementById('mcap').textContent = formatMcap(mcap);
      document.getElementById('posValue').textContent = formatMoney(posVal || tradeAmount);
      document.getElementById('posTokens').textContent =
        tokens > 0 ? tokens.toLocaleString(undefined, { maximumFractionDigits: 0 }) + ' ' + currentCoin.name : '— ' + currentCoin.name;

      const pnlEl = document.getElementById('posPnl');
      if (tokens > 0) {
        pnlEl.textContent = (pnl >= 0 ? '+' : '') + formatMoney(pnl) + ' · ' + (pnlPct >= 0 ? '▲ ' : '▼ ') + Math.abs(pnlPct).toFixed(2) + '%';
        pnlEl.className = 'pos-pnl ' + (pnl >= 0 ? 'green' : 'red');
      } else {
        pnlEl.textContent = '+$0.00 · 0.00%';
        pnlEl.className = 'pos-pnl green';
      }
    }

    function drawChart() {
      ctx.clearRect(0, 0, W, H);
      if (prices.length < 2) return;

      const padL = 8;
      const padR = 8;
      const padT = 16;
      const padB = 20;
      const chartW = W - padL - padR;
      const chartH = H - padT - padB;

      const minP = Math.min(...prices) * 0.97;
      const maxP = Math.max(...prices) * 1.03;
      const range = maxP - minP || 1;

      ctx.strokeStyle = 'rgba(255,255,255,0.04)';
      ctx.lineWidth = 1;
      const gridCount = 5;
      for (let i = 0; i <= gridCount; i++) {
        const y = padT + (chartH / gridCount) * i;
        ctx.beginPath();
        ctx.moveTo(padL, y);
        ctx.lineTo(W - padR, y);
        ctx.stroke();
      }

      ctx.strokeStyle = 'rgba(255,255,255,0.025)';
      for (let i = 1; i < 6; i++) {
        const x = padL + (chartW / 6) * i;
        ctx.beginPath();
        ctx.moveTo(x, padT);
        ctx.lineTo(x, H - padB);
        ctx.stroke();
      }

      const len = prices.length;
      const pts = [];
      for (let i = 0; i < len; i++) {
        const x = padL + (i / (len - 1)) * chartW;
        const y = padT + chartH - ((prices[i] - minP) / range) * chartH;
        pts.push({ x, y });
      }

      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
      ctx.lineTo(pts[pts.length - 1].x, H - padB);
      ctx.lineTo(pts[0].x, H - padB);
      ctx.closePath();
      const grad = ctx.createLinearGradient(0, padT, 0, H - padB);
      grad.addColorStop(0, 'rgba(0, 230, 118, 0.28)');
      grad.addColorStop(0.6, 'rgba(0, 230, 118, 0.08)');
      grad.addColorStop(1, 'rgba(0, 230, 118, 0)');
      ctx.fillStyle = grad;
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
      ctx.strokeStyle = '#00e676';
      ctx.lineWidth = 2;
      ctx.lineJoin = 'round';
      ctx.stroke();

      // last point glow
      const last = pts[pts.length - 1];
      ctx.beginPath();
      ctx.arc(last.x, last.y, 4, 0, Math.PI * 2);
      ctx.fillStyle = '#00e676';
      ctx.fill();
    }

    function tickSim() {
      if (!running) return;
      const elapsed = performance.now() - simStartTime;
      tick++;

      // Exactly 20s: 5s down → 5s chop → 5s slow up → 5s rocket
      if (elapsed >= TOTAL_MS) {
        phase = 'done';
        running = false;
        document.getElementById('startBtn').disabled = false;
        document.getElementById('resetBtn').disabled = false;
        document.getElementById('amount').disabled = false;
        document.getElementById('customPrice').disabled = false;
      } else if (elapsed < PHASE_MS) {
        // 0–5s: downhill
        phase = 'down';
        const drop = currentPrice * (0.012 + Math.random() * 0.018);
        currentPrice = Math.max(startPrice * 0.15, currentPrice - drop);
        if (Math.random() < 0.12) currentPrice *= 0.94 + Math.random() * 0.03;
      } else if (elapsed < PHASE_MS * 2) {
        // 5–10s: fluctuate up and down
        phase = 'chop';
        const vol = currentPrice * 0.025;
        currentPrice += (Math.random() - 0.5) * vol * 2;
        currentPrice = Math.max(startPrice * 0.12, currentPrice);
      } else if (elapsed < PHASE_MS * 3) {
        // 10–15s: slow climb
        phase = 'slow';
        const rise = currentPrice * (0.008 + Math.random() * 0.012);
        currentPrice += rise;
        currentPrice += (Math.random() - 0.4) * currentPrice * 0.008;
      } else {
        // 15–20s: rocket (50% weaker upward progress)
        phase = 'rocket';
        const rise = currentPrice * (0.0275 + Math.random() * 0.04);
        currentPrice += rise;
        currentPrice += (Math.random() - 0.2) * currentPrice * 0.01;
      }

      prices.push(currentPrice);
      if (prices.length > 280) prices.shift();

      updateUI();
      drawChart();

      if (running) {
        animId = requestAnimationFrame(() => setTimeout(tickSim, TICK_MS));
      }
    }

    function startSim() {
      if (running) return;
      tradeAmount = parseFloat(document.getElementById('amount').value) || 1000;
      if (tradeAmount < 1) tradeAmount = 1;

      const base = getBasePrice();
      currentPrice = base;
      startPrice = base;
      tokens = tradeAmount / currentPrice;
      prices = [currentPrice];
      tick = 0;
      phase = 'down';
      running = true;
      simStartTime = performance.now();

      document.getElementById('startBtn').disabled = true;
      document.getElementById('resetBtn').disabled = false;
      document.getElementById('amount').disabled = true;
      document.getElementById('customPrice').disabled = false;

      updateUI();
      drawChart();
      tickSim();
    }

    function resetSim() {
      running = false;
      if (animId) cancelAnimationFrame(animId);
      phase = 'idle';

      const base = getBasePrice();
      currentPrice = base;
      startPrice = base;
      prices = [currentPrice];
      tokens = 0;
      tradeAmount = parseFloat(document.getElementById('amount').value) || 1000;

      document.getElementById('startBtn').disabled = false;
      document.getElementById('resetBtn').disabled = false;
      document.getElementById('amount').disabled = false;
      document.getElementById('customPrice').disabled = false;

      updateUI();
      drawChart();
    }

    function renderCoinList() {
      const list = document.getElementById('coinList');
      list.innerHTML = '';
      COINS.forEach(coin => {
        const item = document.createElement('div');
        item.className = 'coin-item' + (coin.id === currentCoin.id ? ' active' : '');
        item.onclick = () => selectCoin(coin);
        const price = livePriceCache[coin.id] || coin.startPrice;
        item.innerHTML = `
          <div class="coin-avatar">${coin.emoji}</div>
          <div class="coin-meta">
            <div class="coin-name">${coin.name}${coin.live ? '<span class="live-tag">LIVE</span>' : ''}</div>
            <div class="coin-sub">${coin.sub}</div>
          </div>
          <div class="coin-price-side">${formatPrice(price)}</div>
        `;
        list.appendChild(item);
      });
    }

    function selectCoin(coin) {
      if (running) return;
      currentCoin = coin;
      document.getElementById('tokenName').textContent = coin.name;
      document.getElementById('tokenSub').textContent = coin.sub;
      document.getElementById('avatar').textContent = coin.emoji;

      document.getElementById('customPrice').value = '';

      const base = getBasePrice();
      currentPrice = base;
      startPrice = base;
      prices = [base];
      tokens = 0;

      document.getElementById('customPrice').placeholder = base.toString();

      renderCoinList();
      updateUI();
      drawChart();
      closeSidebar();
    }

    function openSidebar() {
      document.getElementById('sidebar').classList.add('open');
      document.getElementById('overlayBg').classList.add('show');
    }
    function closeSidebar() {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('overlayBg').classList.remove('show');
    }

    async function fetchSwordcatPrice() {
      try {
        const res = await fetch('https://api.dexscreener.com/latest/dex/tokens/5tCju6YNxHq5zrA6tGndr6F7TK42mpUFmeE31cSFpump');
        const data = await res.json();
        if (data.pairs && data.pairs.length) {
          const pair = data.pairs[0];
          if (pair.priceUsd) {
            const price = parseFloat(pair.priceUsd);
            if (price > 0) {
              livePriceCache['swordcat'] = price;
              if (currentCoin.id === 'swordcat' && phase === 'idle') {
                const custom = parseFloat(document.getElementById('customPrice').value);
                if (!(custom > 0)) {
                  currentPrice = price;
                  startPrice = price;
                  prices = [price];
                  document.getElementById('customPrice').placeholder = price.toString();
                  updateUI();
                  drawChart();
                }
              }
            }
          }
        }
      } catch (e) {
        console.warn('SWORDCAT live price fetch failed', e);
      }
    }

    async function fetchMajorPrices() {
      try {
        const ids = COINS.filter(c => c.cgId).map(c => c.cgId).join(',');
        if (!ids) return;
        const res = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=' + ids + '&vs_currencies=usd');
        const data = await res.json();
        COINS.forEach(coin => {
          if (coin.cgId && data[coin.cgId] && data[coin.cgId].usd > 0) {
            livePriceCache[coin.id] = data[coin.cgId].usd;
            if (currentCoin.id === coin.id && phase === 'idle') {
              const custom = parseFloat(document.getElementById('customPrice').value);
              if (!(custom > 0)) {
                currentPrice = data[coin.cgId].usd;
                startPrice = data[coin.cgId].usd;
                prices = [data[coin.cgId].usd];
                document.getElementById('customPrice').placeholder = data[coin.cgId].usd.toString();
                updateUI();
                drawChart();
              }
            }
          }
        });
      } catch (e) {
        console.warn('Major coins live price fetch failed', e);
      }
    }

    async function fetchLivePrice() {
      await Promise.all([fetchSwordcatPrice(), fetchMajorPrices()]);
      renderCoinList();
    }

    document.getElementById('customPrice').addEventListener('input', () => {
      // Changing start price stops the sim and resets to the new price
      if (running) {
        running = false;
        if (animId) cancelAnimationFrame(animId);
        phase = 'idle';
        document.getElementById('startBtn').disabled = false;
        document.getElementById('resetBtn').disabled = false;
        document.getElementById('amount').disabled = false;
      }
      const base = getBasePrice();
      currentPrice = base;
      startPrice = base;
      prices = [base];
      tokens = 0;
      tradeAmount = parseFloat(document.getElementById('amount').value) || 1000;
      updateUI();
      drawChart();
    });

    renderCoinList();
    updateUI();
    drawChart();
    fetchLivePrice();
    setInterval(fetchLivePrice, 45000);
  </script>
</body>
</html>
